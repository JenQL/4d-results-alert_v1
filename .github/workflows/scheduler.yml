name: Daily 4D Results Alert

on:
  schedule:
    - cron: "0 11 * * *"   # Runs daily at 11:00 Malaysia time (UTC+8)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4   # ✅ upgrade to v4

      - name: Set up Python
        uses: actions/setup-python@v5   # ✅ upgrade to v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_USER_PASS: ${{ secrets.EMAIL_USER_PASS }}
        run: python Magnum_DamaCai_MY_v1.py
